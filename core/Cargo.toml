[package]
name = "overtone-core"
version = "0.1.0"
edition = "2021"
description = "Shared logic for Overtone: palette engine, lyrics, playback clock"
license = "MIT"
publish = false

[lib]
name = "overtone_core"
crate-type = ["rlib", "cdylib"]

[features]
default = ["net"]
# HTTP lyrics providers. Off for builds that only need palette/clock/LRC.
net = ["dep:ureq", "dep:serde", "dep:serde_json"]

[dependencies]
unicode-normalization = "0.1"
ureq = { version = "2.12", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
